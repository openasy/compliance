# Compliance. ISO 27001, SOC 2, GDPR and PCI DSS controls, judged on what the install's products serve at /metrics,
# with evidence added by hand for the rest (ADR 0058).
#
#   openssl rand -hex 32 > openasy-kek   # compliance's key: sign-in secrets (ADR 0021). Keep it with your backups
#   docker compose up -d
#   docker compose logs compliance | grep 'no owner yet'   # the one-time link that creates the owner account
services:
  compliance:
    image: ghcr.io/openasy/compliance:0.1.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - compliance-data:/data # SQLite database: results, evidence, owners
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The address people open Compliance at; with a TLS proxy in front, its https:// URL.
      COMPLIANCE_PUBLIC_URL: ${COMPLIANCE_PUBLIC_URL:-http://localhost:8080}
      # The install's products, as in every product: compliance reads <address>/metrics of each.
      OPENASY_PRODUCTS: ${OPENASY_PRODUCTS:-}
      # For a product that serves /metrics on a port of its own (ADR 0026):
      # COMPLIANCE_SOURCES: vulnerabilities=http://vulns:9090/metrics,backups=http://backups:9090/metrics
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: compliance
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}

volumes:
  compliance-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
